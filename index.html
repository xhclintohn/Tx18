<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}
body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:#050505;
overflow:hidden;
}
.rose{
width:min(85vw,85vh);
height:min(85vw,85vh);
transform-origin:center center;
}
.spin{
animation:spin 12s linear infinite;
}
@keyframes spin{
from{transform:rotate(0deg)}
to{transform:rotate(360deg)}
}
</style>
</head>

<stop offset="0%" stop-color="#ff4d6d"/>
<stop offset="60%" stop-color="#c9184a"/>
<stop offset="100%" stop-color="#800f2f"/>
</radialGradient>
<radialGradient id="p2" cx="40%" cy="40%" r="60%">
<stop offset="0%" stop-color="#ff758f"/>
<stop offset="50%" stop-color="#ff4d6d"/>
<stop offset="100%" stop-color="#a4133c"/>

<stop offset="100%" stop-color="#1b4332"/>
</radialGradient>
<filter id="soft">
<feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
<feOffset in="blur" dx="1" dy="2" result="offset"/>
<feMerge>
<feMergeNode in="offset"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

</svg>
