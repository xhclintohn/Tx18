<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}
body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:#030303;
overflow:hidden;
}
.rose{
width:min(70vw,90vh);
height:min(70vw,90vh);
transform-origin:center center;
}
.spin{
animation:spin 14s linear infinite;
}
@keyframes spin{
from{transform:rotate(0deg)}
to{transform:rotate(-360deg)}
}
</style>
</head>
<body>
<svg class="rose" viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="stemG" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#1a4d2e"/>
<stop offset="40%" stop-color="#2d6a4f"/>
<stop offset="100%" stop-color="#1b4332"/>
</linearGradient>
<radialGradient id="petalDeep" cx="40%" cy="30%" r="70%">
<stop offset="0%" stop-color="#ff6b8a"/>
<stop offset="45%" stop-color="#e63950"/>
<stop offset="100%" stop-color="#9b2226"/>
</radialGradient>
<radialGradient id="petalMid" cx="50%" cy="35%" r="65%">
<stop offset="0%" stop-color="#ff8fa3"/>
<stop offset="50%" stop-color="#ff4d6d"/>
<stop offset="100%" stop-color="#c9184a"/>
</radialGradient>
<radialGradient id="petalLight" cx="55%" cy="40%" r="60%">
<stop offset="0%" stop-color="#ffb3c1"/>
<stop offset="40%" stop-color="#ff758f"/>
<stop offset="100%" stop-color="#e63950"/>
</radialGradient>
<radialGradient id="centerG" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#ffe5ec"/>
<stop offset="60%" stop-color="#ff8fa3"/>
<stop offset="100%" stop-color="#c9184a"/>
</radialGradient>
<linearGradient id="leafG" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#40916c"/>
<stop offset="100%" stop-color="#1b4332"/>
</linearGradient>
<filter id="depth">
<feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="b"/>
<feOffset in="b" dx="1.5" dy="2" result="o"/>
<feMerge>
<feMergeNode in="o"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
</defs>
<g transform="translate(150,380)">
<path d="M-6,0 C-8,-40 -5,-90 0,-140 C5,-90 8,-40 6,0 Z" fill="url(#stemG)"/>
<path d="M-4,-50 Q-35,-70 -45,-45 Q-20,-40 -4,-50" fill="url(#leafG)" opacity="0.95"/>
<path d="M4,-80 Q40,-100 48,-70 Q20,-65 4,-80" fill="url(#leafG)" opacity="0.9"/>
<path d="M-3,-110 Q-30,-125 -28,-95 Q-10,-100 -3,-110" fill="url(#leafG)" opacity="0.85"/>
</g>
<g transform="translate(150,160)" filter="url(#depth)">
<path d="M-55,40 C-70,10 -65,-30 -40,-55 C-20,-70 10,-65 30,-45 C45,-25 50,5 35,30 C20,50 -20,55 -55,40" fill="url(#petalDeep)" opacity="0.95"/>
<path d="M55,35 C70,5 60,-35 30,-55 C5,-70 -25,-60 -40,-35 C-50,-15 -45,15 -25,35 C-5,50 30,50 55,35" fill="url(#petalDeep)" opacity="0.92"/>
<path d="M-45,25 C-60,-5 -50,-40 -25,-55 C0,-65 25,-55 40,-30 C50,-10 45,20 25,35 C5,48 -20,45 -45,25" fill="url(#petalMid)"/>
<path d="M40,20 C55,-10 45,-45 15,-55 C-10,-60 -35,-45 -40,-20 C-42,0 -30,25 -10,35 C10,45 30,40 40,20" fill="url(#petalMid)" opacity="0.95"/>
<path d="M-30,15 C-45,-15 -35,-45 -10,-55 C15,-60 35,-45 40,-20 C42,0 30,25 10,35 C-10,42 -20,35 -30,15" fill="url(#petalLight)"/>
<path d="M25,10 C40,-20 30,-50 5,-55 C-20,-55 -35,-35 -30,-10 C-25,10 -5,30 15,32 C30,30 20,20 25,10" fill="url(#petalLight)" opacity="0.98"/>
<path d="M-15,5 C-30,-20 -20,-45 5,-50 C25,-48 35,-25 30,0 C25,20 5,30 -10,25 C-20,20 -10,15 -15,5" fill="url(#petalMid)"/>
<path d="M10,0 C22,-25 15,-45 -5,-48 C-22,-45 -28,-25 -20,0 C-12,18 5,22 15,15 C20,10 8,8 10,0" fill="url(#petalLight)"/>
<path d="M-5,-5 C-15,-25 -8,-40 5,-42 C18,-38 20,-20 12,0 C5,12 -5,12 -8,5 C-10,0 -2,-2 -5,-5" fill="url(#centerG)"/>
<ellipse cx="0" cy="-8" rx="8" ry="6" fill="#ffe5ec" opacity="0.7"/>
</g>
</svg>
<script>
var ANIMATION = true;
if(ANIMATION){document.querySelector('.rose').classList.add('spin');}
</script>
</body>
</html>
