<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}
body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:#0a0a0a;
overflow:hidden;
}
.rose{
width:min(80vw,80vh);
height:min(80vw,80vh);
transform-origin:center center;
}
.spin{
animation:spin 18s linear infinite;
}
@keyframes spin{
from{transform:rotate(0deg)}
to{transform:rotate(360deg)}
}
</style>
</head>
<body>
<svg class="rose" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialGradient id="outer" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#ff6b6b"/>
<stop offset="55%" stop-color="#c92a2a"/>
<stop offset="100%" stop-color="#862e2e"/>
</radialGradient>
<radialGradient id="mid" cx="45%" cy="45%" r="55%">
<stop offset="0%" stop-color="#ff8787"/>
<stop offset="50%" stop-color="#fa5252"/>
<stop offset="100%" stop-color="#c92a2a"/>
</radialGradient>
<radialGradient id="inner" cx="50%" cy="40%" r="50%">
<stop offset="0%" stop-color="#ffa8a8"/>
<stop offset="45%" stop-color="#ff6b6b"/>
<stop offset="100%" stop-color="#e03131"/>
</radialGradient>
<radialGradient id="core" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#fff0f0"/>
<stop offset="40%" stop-color="#ffc9c9"/>
<stop offset="100%" stop-color="#ff6b6b"/>
</radialGradient>
<filter id="glow">
<feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
<feOffset in="blur" dx="0" dy="2" result="offset"/>
<feComponentTransfer>
<feFuncA type="linear" slope="0.3"/>
</feComponentTransfer>
<feMerge>
<feMergeNode/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
</defs>
<g transform="translate(250,250)" filter="url(#glow)">
<path d="M0,-95 C55,-95 95,-55 95,0 C95,55 55,95 0,95 C-55,95 -95,55 -95,0 C-95,-55 -55,-95 0,-95" fill="url(#outer)" opacity="0.9" transform="rotate(0) scale(1.05)"/>
<path d="M0,-90 C50,-90 90,-50 90,0 C90,50 50,90 0,90 C-50,90 -90,50 -90,0 C-90,-50 -50,-90 0,-90" fill="url(#outer)" transform="rotate(22.5)"/>
<path d="M0,-85 C48,-85 85,-48 85,0 C85,48 48,85 0,85 C-48,85 -85,48 -85,0 C-85,-48 -48,-85 0,-85" fill="url(#outer)" opacity="0.95" transform="rotate(45)"/>
<path d="M0,-80 C45,-80 80,-45 80,0 C80,45 45,80 0,80 C-45,80 -80,45 -80,0 C-80,-45 -45,-80 0,-80" fill="url(#mid)" transform="rotate(11)"/>
<path d="M0,-75 C42,-75 75,-42 75,0 C75,42 42,75 0,75 C-42,75 -75,42 -75,0 C-75,-42 -42,-75 0,-75" fill="url(#mid)" transform="rotate(33.5)"/>
<path d="M0,-70 C40,-70 70,-40 70,0 C70,40 40,70 0,70 C-40,70 -70,40 -70,0 C-70,-40 -40,-70 0,-70" fill="url(#mid)" opacity="0.95" transform="rotate(56)"/>
<path d="M0,-60 C35,-60 60,-35 60,0 C60,35 35,60 0,60 C-35,60 -60,35 -60,0 C-60,-35 -35,-60 0,-60" fill="url(#inner)" transform="rotate(5)"/>
<path d="M0,-55 C32,-55 55,-32 55,0 C55,32 32,55 0,55 C-32,55 -55,32 -55,0 C-55,-32 -32,-55 0,-55" fill="url(#inner)" transform="rotate(27.5)"/>
<path d="M0,-50 C28,-50 50,-28 50,0 C50,28 28,50 0,50 C-28,50 -50,28 -50,0 C-50,-28 -28,-50 0,-50" fill="url(#inner)" opacity="0.97" transform="rotate(50)"/>
<path d="M0,-40 C23,-40 40,-23 40,0 C40,23 23,40 0,40 C-23,40 -40,23 -40,0 C-40,-23 -23,-40 0,-40" fill="url(#core)" transform="rotate(15)"/>
<path d="M0,-35 C20,-35 35,-20 35,0 C35,20 20,35 0,35 C-20,35 -35,20 -35,0 C-35,-20 -20,-35 0,-35" fill="url(#core)" transform="rotate(37.5)"/>
<path d="M0,-28 C16,-28 28,-16 28,0 C28,16 16,28 0,28 C-16,28 -28,16 -28,0 C-28,-16 -16,-28 0,-28" fill="url(#core)" opacity="0.95" transform="rotate(60)"/>
<circle cx="0" cy="0" r="18" fill="url(#core)"/>
<circle cx="0" cy="0" r="10" fill="#fff5f5" opacity="0.85"/>
<circle cx="0" cy="0" r="5" fill="#ffc9c9" opacity="0.7"/>
</g>
</svg>
<script>
var ANIMATION = true;
if(ANIMATION){document.querySelector('.rose').classList.add('spin');}
</script>
</body>
</html>
